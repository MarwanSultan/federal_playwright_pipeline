name: Secure Playwright Validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build framework container
        run: docker compose build --pull framework
      - name: Prepare evidence directories
        run: mkdir -p playwright-report test-results
      - name: Validate inside framework container
        run: docker compose run --rm validate
      - name: Run all tests inside framework container
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ENVIRONMENT_CLASSIFICATION: ${{ vars.ENVIRONMENT_CLASSIFICATION || 'non-production' }}
          ENABLE_CROSS_BROWSER: 'false'
        run: docker compose run --rm framework
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
