services:
  framework:
    build:
      context: .
      dockerfile: Dockerfile
    image: playwright-pipeline:${PIPELINE_IMAGE_TAG:-local}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CI: 'true'
      BASE_URL: ${BASE_URL:-}
      API_BASE_URL: ${API_BASE_URL:-}
      ENVIRONMENT_CLASSIFICATION: ${ENVIRONMENT_CLASSIFICATION:-non-production}
      ENABLE_CROSS_BROWSER: ${ENABLE_CROSS_BROWSER:-false}
      # Authorization Tests
      AUTHZ_CONTRACT_READY: ${AUTHZ_CONTRACT_READY:-}
      # Critical Workflows
      CRITICAL_WORKFLOWS_READY: ${CRITICAL_WORKFLOWS_READY:-false}
      CRITICAL_AUTH_PATH: ${CRITICAL_AUTH_PATH:-}
      CRITICAL_AUTH_MARKER: ${CRITICAL_AUTH_MARKER:-}
      CRITICAL_PRIMARY_PATH: ${CRITICAL_PRIMARY_PATH:-}
      CRITICAL_PRIMARY_MARKER: ${CRITICAL_PRIMARY_MARKER:-}
      CRITICAL_SUBMISSION_PATH: ${CRITICAL_SUBMISSION_PATH:-}
      CRITICAL_SUBMISSION_MARKER: ${CRITICAL_SUBMISSION_MARKER:-}
      CRITICAL_AUTHZ_PATH: ${CRITICAL_AUTHZ_PATH:-}
      CRITICAL_AUTHZ_MARKER: ${CRITICAL_AUTHZ_MARKER:-}
      CRITICAL_AUDIT_PATH: ${CRITICAL_AUDIT_PATH:-}
      CRITICAL_AUDIT_MARKER: ${CRITICAL_AUDIT_MARKER:-}
      # API Tests (critical-api.spec.ts)
      API_TESTS_READY: ${API_TESTS_READY:-false}
      API_HEALTH_PATH: ${API_HEALTH_PATH:-}
      API_AUTH_PATH: ${API_AUTH_PATH:-}
      API_AUTH_STATUS: ${API_AUTH_STATUS:-200}
      API_PRIMARY_PATH: ${API_PRIMARY_PATH:-}
      API_PRIMARY_MARKER: ${API_PRIMARY_MARKER:-}
      API_SUBMISSION_PATH: ${API_SUBMISSION_PATH:-}
      API_SUBMISSION_MARKER: ${API_SUBMISSION_MARKER:-}
      API_SUBMISSION_BODY: ${API_SUBMISSION_BODY:-}
      API_UNAUTHORIZED_PATH: ${API_UNAUTHORIZED_PATH:-}
      API_UNAUTHORIZED_STATUS: ${API_UNAUTHORIZED_STATUS:-403}
      API_AUDIT_PATH: ${API_AUDIT_PATH:-}
      API_AUDIT_MARKER: ${API_AUDIT_MARKER:-}
      # Security API Regression Tests (security-regression.spec.ts)
      API_SECURITY_PATH: ${API_SECURITY_PATH:-}
      API_REQUIRED_HEADERS: ${API_REQUIRED_HEADERS:-}
      API_PROTECTED_PATH: ${API_PROTECTED_PATH:-}
      API_PROTECTED_STATUS: ${API_PROTECTED_STATUS:-401}
      API_FORBIDDEN_PATH: ${API_FORBIDDEN_PATH:-}
      API_FORBIDDEN_TOKEN: ${API_FORBIDDEN_TOKEN:-}
      API_FORBIDDEN_STATUS: ${API_FORBIDDEN_STATUS:-403}
      API_VALIDATION_PATH: ${API_VALIDATION_PATH:-}
      API_VALIDATION_BODY: ${API_VALIDATION_BODY:-}
      API_VALIDATION_STATUS: ${API_VALIDATION_STATUS:-400}
      API_METHOD_PATH: ${API_METHOD_PATH:-}
      API_UNSUPPORTED_METHOD: ${API_UNSUPPORTED_METHOD:-TRACE}
      API_METHOD_STATUS: ${API_METHOD_STATUS:-405}
      API_AUDIT_REQUIRED_FIELDS: ${API_AUDIT_REQUIRED_FIELDS:-}
    volumes:
      - ./playwright-report:/work/playwright-report
      - ./test-results:/work/test-results
    command: npm test

  validate:
    extends:
      service: framework
    command: sh -c 'npm run format:check && npm run lint && npm run typecheck && npm run traceability:validate'

  security-tests:
    extends:
      service: framework
    command: npm run test:security

  critical-tests:
    extends:
      service: framework
    command: npm run test:critical
